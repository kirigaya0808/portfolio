<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Any Music — плеер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text">any music</span>
    </div>
    <button class="icon-btn header-add-btn" id="addTracksBtn" title="Добавить музыку с устройства">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Добавить музыку</span>
    </button>
  </header>

  <div class="app-body">

    <!-- ===== Sidebar: playlists ===== -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Плейлисты</h2>
        <button class="icon-btn small-btn" id="newPlaylistBtn" title="Новый плейлист">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <ul class="playlist-list" id="playlistList"></ul>
    </aside>

    <!-- ===== Main: queue / track list ===== -->
    <main class="main-panel">
      <div class="main-panel-head">
        <div class="playlist-meta" id="playlistMeta">
          <div class="playlist-cover" id="playlistCover"></div>
          <div>
            <p class="eyebrow" id="playlistKind">Плейлист</p>
            <h1 id="playlistName">Библиотека</h1>
            <p class="track-count" id="playlistCount">0 треков</p>
          </div>
        </div>
        <button class="icon-btn ghost-btn" id="addToPlaylistBtn" title="Добавить трек в этот плейлист">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Добавить трекs</span>
        </button>
      </div>

      <div class="track-list" id="trackList">
        <div class="empty-state" id="emptyState">
          <div class="empty-glyph">
            <svg viewBox="0 0 24 24" width="28" height="28"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          </div>
          <p>Здесь пока пусто</p>
          <button class="pill-btn" id="emptyAddBtn">Добавить музыку с устройства</button>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== Player bar ===== -->
  <footer class="player-bar">
    <div class="now-playing">
      <div class="now-cover" id="nowCover">
        <div class="eq" id="eqBars"><span></span><span></span><span></span></div>
      </div>
      <div class="now-text">
        <p class="now-title" id="nowTitle">Ничего не играет</p>
        <p class="now-artist" id="nowArtist">Выберите трек</p>
      </div>
    </div>

    <div class="player-core">
      <div class="transport">
        <button class="icon-btn toggle-btn" id="shuffleBtn" title="Перемешать">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M3 6h3.5L15 18h3.5M16 6h2.5v2.5M13.5 6H10L8 8.5M18.5 18H16M3 18h3.5L9 14M18.5 6L21 8.5M18.5 18L21 15.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn transport-btn" id="prevBtn" title="Предыдущий трек">
          <svg viewBox="0 0 24 24" width="19" height="19"><path d="M6 5v14M18 5L8 12l10 7V5z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn play-btn" id="playBtn" title="Играть">
          <svg viewBox="0 0 24 24" width="22" height="22" id="playIcon"><path d="M7 4l13 8-13 8V4z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn transport-btn" id="nextBtn" title="Следующий трек">
          <svg viewBox="0 0 24 24" width="19" height="19"><path d="M18 5v14M6 5l10 7-10 7V5z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn toggle-btn" id="repeatBtn" title="Повтор: выключен">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M4 7h13a3 3 0 0 1 3 3v1M20 17H7a3 3 0 0 1-3-3v-1M8 4L4.5 7 8 10M16 20l3.5-3-3.5-3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="repeat-one-dot" id="repeatOneDot">1</span>
        </button>
      </div>

      <div class="seek-row">
        <span class="time" id="timeCurrent">0:00</span>
        <input type="range" id="seekSlider" class="slider" min="0" max="1000" value="0" step="1">
        <span class="time" id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="player-side">
      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 10v4h3l4 4V6l-4 4H4z" fill="currentColor"/><path d="M17 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <input type="range" id="volumeSlider" class="slider slim" min="0" max="100" value="80" step="1">
      </div>
      <button class="icon-btn toggle-btn" id="settingsBtn" title="Настройки звука">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.7-1.3-1.7-3-2 .6a7.7 7.7 0 0 0-2.6-1.5L14.4 3H9.6l-.4 2.3a7.7 7.7 0 0 0-2.6 1.5l-2-.6-1.7 3L4.6 10.5a7.6 7.6 0 0 0 0 3L2.9 14.8l1.7 3 2-.6a7.7 7.7 0 0 0 2.6 1.5l.4 2.3h4.8l.4-2.3a7.7 7.7 0 0 0 2.6-1.5l2 .6 1.7-3-1.7-1.3z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </footer>

  <!-- ===== Settings popover ===== -->
  <div class="popover" id="settingsPopover">
    <div class="popover-head">
      <h3>Звук</h3>
      <button class="icon-btn small-btn" id="closeSettings">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="control-row">
      <div class="control-label">
        <span>Скорость</span>
        <span class="control-value" id="speedValue">1.0×</span>
      </div>
      <input type="range" id="speedSlider" class="slider" min="0.5" max="2" step="0.05" value="1">
      <div class="control-hint"><span>0.5×</span><span>2×</span></div>
    </div>
    <div class="control-row">
      <div class="control-label">
        <span>Тон</span>
        <span class="control-value" id="toneValue">0</span>
      </div>
      <input type="range" id="toneSlider" class="slider" min="-1" max="1" step="0.05" value="0">
      <div class="control-hint"><span>низкие</span><span>высокие</span></div>
    </div>
    <button class="pill-btn ghost" id="resetSoundBtn">Сбросить</button>
  </div>

  <!-- ===== New playlist modal ===== -->
  <div class="modal-overlay" id="playlistModalOverlay">
    <div class="modal">
      <h3>Новый плейлист</h3>
      <label class="field-label">Обложка</label>
      <button class="cover-picker" id="coverPicker">
        <img id="coverPreview" alt="" hidden>
        <span id="coverPickerPlaceholder">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 16l4.5-5 3 3.2L16 9l4 6.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
          <small>Загрузить обложку</small>
        </span>
      </button>
      <input type="file" id="coverInput" accept="image/*" hidden>
      <label class="field-label" for="playlistNameInput">Название</label>
      <input type="text" id="playlistNameInput" class="text-input" placeholder="Например, «Вечерний джаз»" maxlength="40">
      <div class="modal-actions">
        <button class="pill-btn ghost" id="cancelPlaylistBtn">Отмена</button>
        <button class="pill-btn" id="createPlaylistBtn">Создать</button>
      </div>
    </div>
  </div>

  <!-- ===== Add-to-playlist picker modal ===== -->
  <div class="modal-overlay" id="pickerModalOverlay">
    <div class="modal">
      <h3 id="pickerTitle">Добавить треки</h3>
      <ul class="picker-list" id="pickerList"></ul>
      <div class="modal-actions">
        <button class="pill-btn ghost" id="cancelPickerBtn">Закрыть</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="audio/*" multiple hidden>
  <audio id="audio" preload="metadata"></audio>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>
<script src="script.js"></script>
</body>
</html>
